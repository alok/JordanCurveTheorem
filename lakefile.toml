name = "JordanCurveTheorem"
version = "0.1.0"
defaultTargets = ["Reeken"]
# Direct audit and checker invocations need ordinary on-disk import artifacts.
restoreAllArtifacts = true

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "0df444a360eaa60ab8c11dca51a86af692955474"

[[lean_lib]]
name = "Reeken"

[[lean_lib]]
name = "Verification"

[[lean_lib]]
name = "Schoenflies"
srcDir = "vendor"

[lean_lib.leanOptions]
autoImplicit = true
relaxedAutoImplicit = false
