name = "JordanCurveTheorem"
version = "0.1.0"
defaultTargets = ["Reeken"]
# Direct audit and checker invocations need ordinary on-disk import artifacts.
restoreAllArtifacts = true
# mathlib requires the module system; these files are not yet modules.
allowNonModules = true

[leanOptions]
autoImplicit = false
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Reeken"

[[lean_lib]]
name = "Verification"

[[lean_lib]]
name = "Schoenflies"
srcDir = "vendor"

[lean_lib.leanOptions]
autoImplicit = true
relaxedAutoImplicit = false
